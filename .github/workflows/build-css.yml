name: Build CSS bundle

on:
  push:
    branches: [main]
    paths:
      - 'css/main.css'
      - 'css/retro-theme.css'
      - 'css/components.css'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build:css

      - name: Commit bundle if changed
        run: |
          if git diff --quiet -- css/bundle.min.css; then
            echo "No changes to css/bundle.min.css"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/bundle.min.css
          git commit -m "chore: rebuild css/bundle.min.css [skip ci]"
          git push
